<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <header>
    <h1>Clinic Dashboard</h1>
  </header>

  <main class="dashboard-main">
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total Patients</span>
      </div>
      <div class="stat-card stat-routine">
        <span class="stat-value" id="stat-routine">0</span>
        <span class="stat-label">Routine</span>
      </div>
      <div class="stat-card stat-soon">
        <span class="stat-value" id="stat-soon">0</span>
        <span class="stat-label">Soon</span>
      </div>
      <div class="stat-card stat-urgent">
        <span class="stat-value" id="stat-urgent">0</span>
        <span class="stat-label">Urgent</span>
      </div>
    </section>

    <section class="card">
      <h2>Patients</h2>
            <div class="controls-row">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search by patient name..."
        />

        <div class="filter-buttons" id="filter-buttons">
          <button type="button" class="filter-btn active" data-filter="All">All</button>
          <button type="button" class="filter-btn" data-filter="Routine">Routine</button>
          <button type="button" class="filter-btn" data-filter="Soon">Soon</button>
          <button type="button" class="filter-btn" data-filter="Urgent">Urgent</button>
        </div>
      </div>
     <div id="loading-message" class="loading-message">
  <span class="spinner spinner-dark"></span>Loading patients...
</div>
      <div id="error-message" class="error-message" style="display: none;"></div>
      <div id="empty-message" class="empty-state" style="display: none;">
        No patients yet. Submissions will appear here.
      </div>
            <div id="no-results-message" class="empty-state" style="display: none;">
        No patients match your search or filter.
      </div>
      <table id="patients-table" class="patients-table" style="display: none;">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Age</th>
            <th>Symptoms</th>
            <th>Duration</th>
            <th>Attention</th>
          </tr>
        </thead>
        <tbody id="patients-table-body"></tbody>
      </table>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
